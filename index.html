<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kideco · Component Health Control Room</title>
<meta name="theme-color" content="#14181d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--A:#16a34a;--B:#eab308;--C:#ef4444;--X:#7f1d1d;--N:#94a3b8;--acc:#0d9488;--acc2:#14b8a6;
 --side:#14181d;--side2:#1d232a;--sidetx:#e7ebef;--sidesub:#8b96a3;
 --f:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fc:"Barlow Condensed","Arial Narrow",var(--f);--fm:"JetBrains Mono",ui-monospace,Menlo,monospace}
[data-theme=light]{color-scheme:light;--bg:#f2f1ed;--card:#fff;--line:#e3e1db;--tx:#1b2026;--sub:#6b7280;--soft:#f7f6f3;--hov:#eef7f6;--xt:#7f1d1d}
[data-theme=dark]{color-scheme:dark;--bg:#0d1013;--card:#161a1f;--line:#262c33;--tx:#e8ecf0;--sub:#8d98a5;--soft:#1b2026;--hov:#1a2a2a;--xt:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--tx);font-size:13px;display:grid;grid-template-columns:248px 1fr;min-height:100vh}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}.sub{color:var(--sub)}
/* ===== sidebar ===== */
.side{background:var(--side);color:var(--sidetx);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto;scrollbar-width:thin}
.brand{display:flex;gap:10px;align-items:center;padding:0 4px}
.brand .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#0f4c47);display:grid;place-items:center;font-family:var(--fc);font-weight:700;font-size:18px;letter-spacing:.02em}
.brand b{font-family:var(--fc);font-size:19px;letter-spacing:.03em;display:block;line-height:1}.brand small{font-size:10.5px;color:var(--sidesub);letter-spacing:.08em;text-transform:uppercase}
.sh{font-family:var(--fc);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sidesub);margin:0 4px 8px}
.nav{display:grid;gap:4px}
.nav button{display:grid;grid-template-columns:1fr auto;gap:5px 8px;padding:9px 10px;border-radius:10px;text-align:left;border:1px solid transparent}
.nav button:hover{background:var(--side2)}.nav button.on{background:var(--side2);border-color:#2f3a44;box-shadow:inset 3px 0 0 var(--acc2)}
.nav b{font-weight:600;font-size:14px}.nav span{font-size:11px;color:var(--sidesub)}
.mini{grid-column:1/-1;display:flex;height:5px;border-radius:9px;overflow:hidden;background:#2a323b}.mini i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;border:1px solid #2c343d;font-size:12px;font-weight:600;color:var(--sidetx)}
.chips button:hover{background:var(--side2)}.chips button.on{background:#e7ebef;color:#14181d;border-color:#e7ebef}
.side select{width:100%;background:var(--side2);border:1px solid #2c343d;border-radius:9px;padding:8px 10px;color:var(--sidetx)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 4px;cursor:pointer}
.tog input{accent-color:var(--acc2);width:16px;height:16px}
.sfoot{margin-top:auto;display:grid;gap:8px;font-size:11px;color:var(--sidesub)}
.sbtn{display:flex;justify-content:center;gap:6px;padding:9px;border-radius:10px;font-weight:600;font-size:12.5px;border:1px solid #2c343d;color:var(--sidetx)}
.sbtn:hover{background:var(--side2)}.sbtn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.sbtn.pri:hover{background:#0f766e}
.sbtn:disabled{opacity:.5;pointer-events:none}.srow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--N);margin-right:6px}
.dot[data-s=live]{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}.dot[data-s=cached]{background:var(--B)}.dot[data-s=error]{background:var(--C)}.dot[data-s=busy]{background:var(--acc2);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
/* ===== main ===== */
main{padding:18px 22px 30px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.top h1{font-family:var(--fc);font-size:30px;font-weight:700;letter-spacing:.01em;line-height:1}
.top .crumb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin-bottom:4px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.in{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:38px}
#q{width:min(320px,70vw)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-weight:600;min-height:38px}.btn:hover{background:var(--hov)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}.btn.acc:hover{background:#0f766e}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h2{font-family:var(--fc);font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ph .sub{font-size:11.5px}
/* status strip */
.strip{display:grid;grid-template-columns:repeat(6,1fr);margin-bottom:12px;overflow:hidden}
.strip>div{padding:12px 16px;border-right:1px solid var(--line);position:relative}.strip>div:last-child{border-right:0}
.strip>div:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c,transparent)}
.strip small{font-family:var(--fc);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);font-weight:600}
.strip b{display:block;font-family:var(--fc);font-size:34px;font-weight:700;line-height:1.1;color:var(--c2,var(--tx))}
.strip span{font-size:11.5px;color:var(--sub)}
.strip>div.stack{grid-column:1/-1;display:flex;height:8px;padding:0;border-right:0}.strip>div.stack:before{display:none}.stack i{display:block;height:100%}
/* overview */
.ov{display:grid;grid-template-columns:330px minmax(0,1fr) minmax(0,1.15fr);gap:12px;margin-bottom:12px}
.pie{display:grid;justify-items:center;gap:12px;padding:14px 16px}
.pie .cv{position:relative;width:200px;height:200px}.pie svg{width:100%;height:100%;transform:rotate(-90deg)}
.pie circle[data-st]{cursor:pointer;transition:opacity .15s}.pie circle[data-st]:hover{opacity:.8}
.pie .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.pie .ctr b{font-family:var(--fc);font-size:40px;line-height:1}.pie .ctr span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.lg button{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;text-align:left}
.lg button:hover{background:var(--hov)}.lg button.on{border-color:var(--acc);background:var(--hov)}
.lg b{font-family:var(--fc);font-size:20px;line-height:1;margin-left:auto}.lg small{display:block;font-size:10.5px;color:var(--sub)}
.gr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-family:var(--fm);font-weight:700;font-size:12px;color:#fff;background:var(--N);flex:none}
.gr[data-g=A]{background:var(--A)}.gr[data-g=B]{background:var(--B);color:#3b2a00}.gr[data-g=C]{background:var(--C)}.gr[data-g=X]{background:var(--X)}.gr[data-g="_"]{background:transparent;color:var(--sub);border:1px dashed var(--N)}
.gr.s{width:15px;height:15px;font-size:9px;border-radius:4px}
.ndn{font-size:11px;text-align:center}
.cbars{padding:8px 16px 14px;display:grid;gap:7px;max-height:340px;overflow:auto;scrollbar-width:thin}
.cb{display:grid;grid-template-columns:128px 1fr 34px;gap:10px;align-items:center;text-align:left;padding:3px 0}
.cb:hover .bt{opacity:.85}.cb span{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--soft)}.bt i{display:block;height:100%}
.cb em{font-style:normal;font-family:var(--fm);font-size:11px;color:var(--sub);text-align:right}
.wl{padding:8px 10px 12px;display:grid;gap:7px;max-height:340px;overflow:auto;scrollbar-width:thin}
.wi{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;text-align:left;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--soft)}
.wi:hover{border-color:var(--acc)}.wi .gr{grid-row:span 2}.wi b{font-size:13px}.wi .u{font-family:var(--fm);font-size:11.5px;color:var(--sub)}
.wi p{grid-column:2/-1;font-size:11.5px;line-height:1.35}
.empty{padding:24px;text-align:center;color:var(--sub)}
/* matrix */
.mx{overflow:hidden}.wrap{max-height:78vh;overflow:auto;scrollbar-width:thin;overscroll-behavior:contain}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:5;background:var(--card);font-family:var(--fc);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);padding:11px 8px;border-bottom:2px solid var(--line);white-space:nowrap;text-align:left}
th.hl{color:var(--acc);border-bottom-color:var(--acc)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.uc{position:sticky;left:0;z-index:4;background:var(--card);width:176px;min-width:176px;border-right:1px solid var(--line);padding:12px}
th.uc{z-index:6;color:var(--acc)}
.cc{width:200px;min-width:200px}
.un{font-family:var(--fc);font-size:21px;font-weight:700;letter-spacing:.02em;text-align:left;line-height:1}.un:hover{color:var(--acc)}
.um{font-size:11px;color:var(--sub);margin:3px 0 8px;line-height:1.45}
.hs{display:flex;flex-wrap:wrap;gap:2px}.hs i{width:9px;height:9px;border-radius:2px;background:var(--N);opacity:.9}
/* tile */
.tile{--c:var(--A);--t:#fff;display:flex;flex-direction:column;width:100%;min-height:158px;text-align:left;border-radius:11px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) var(--m,8%),var(--card));transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 28%,transparent)}
.tile[data-s=Caution]{--c:var(--B);--t:#3b2a00;--m:14%}.tile[data-s=Critical]{--c:var(--C);--m:16%}.tile[data-s=Extreme]{--c:var(--X);--m:30%}.tile[data-s="No Data"]{--c:var(--N);--t:#fff;--m:0%;border-style:dashed}
.tile.dim{opacity:.15;filter:grayscale(1)}
.th{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--c);color:var(--t);padding:5px 9px}
.th b{font-family:var(--fc);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.th .gr{background:rgba(255,255,255,.22);color:inherit;width:20px;height:20px}
.tile[data-s="No Data"] .th{background:var(--soft);color:var(--sub)}
.tb2{padding:7px 9px 8px;display:flex;flex-direction:column;gap:6px;flex:1;font-size:11px}
.lf{display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:baseline}
.lf .pc{font-family:var(--fc);font-size:19px;font-weight:700;line-height:1}
.lf .bar{grid-column:1/-1;position:relative;height:6px;border-radius:9px;background:color-mix(in srgb,var(--tx) 10%,transparent);overflow:visible}
.lf .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}.lf .bar u{position:absolute;right:0;top:-3px;bottom:-3px;width:2px;background:var(--tx);opacity:.35}
.lf small{grid-column:1/-1;color:var(--sub);font-size:10.5px}
.ovr{color:#dc2626}[data-theme=dark] .ovr{color:#f87171}
.rs{display:grid;gap:4px}
.rr{display:grid;grid-template-columns:28px auto 1fr;gap:6px;align-items:center}
.rr>span:first-child{font-family:var(--fc);font-weight:700;font-size:11.5px;letter-spacing:.04em;color:var(--sub)}
.rr .tr{display:flex;gap:2px;align-items:center;font-size:9.5px;color:var(--sub)}
.rec{font-size:11px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-top:6px;border-top:1px dashed color-mix(in srgb,var(--c) 50%,var(--line))}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--tx) 9%,transparent);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.w{background:#fde68a;color:#78350f}
.ph0{min-height:52px;border:1px dashed var(--line);border-radius:11px;display:grid;place-items:center;color:var(--sub)}
#count{font-size:11.5px;color:var(--sub);padding:10px 16px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--card);z-index:50;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.25)}
.drawer.on{transform:none}.drawer.wide{width:min(1180px,100vw)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dh .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}.dh h2{font-family:var(--fc);font-size:26px;line-height:1.1}
.db{padding:16px 20px 30px;overflow:auto;flex:1}
.hero{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--c);color:var(--t,#fff);margin-bottom:14px}
.hero .gr{width:46px;height:46px;font-size:24px;background:rgba(255,255,255,.2);color:inherit}
.hero b{font-family:var(--fc);font-size:22px;letter-spacing:.05em;text-transform:uppercase;display:block}.hero p{font-size:12.5px;opacity:.95}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.kv div{background:var(--card);padding:9px 12px}.kv small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:2px}.kv b{font-size:14px}
.sec{margin-bottom:18px}.sec>h3{font-family:var(--fc);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ai{border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:12px;overflow:hidden}
.ai .aih{background:color-mix(in srgb,var(--acc) 10%,var(--card));padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ai .aih b{font-size:13.5px}.badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--acc);color:#fff}
.ai .aib{padding:12px 14px;display:grid;gap:12px}
.ai h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);margin-bottom:5px}
.ai ul{list-style:none;display:grid;gap:5px}.ai li{padding-left:16px;position:relative;line-height:1.45}.ai li:before{content:"›";position:absolute;left:3px;color:var(--acc);font-weight:700}
.chk{display:grid;gap:4px}.chk label{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:8px;cursor:pointer;line-height:1.45}
.chk label:hover{background:var(--soft)}.chk input{margin-top:3px;accent-color:var(--acc)}.chk input:checked+span{text-decoration:line-through;color:var(--sub)}
.chk .ex{border-left:3px solid var(--X);background:color-mix(in srgb,var(--X) 7%,transparent)}
.timing{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:color-mix(in srgb,var(--c) 12%,var(--card));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));font-weight:600}
.disc{font-size:11px;color:var(--sub);line-height:1.5;padding:8px 14px;border-top:1px solid var(--line)}
.seq{display:flex;flex-wrap:wrap;gap:3px}.seq .gr.t{outline:2px solid var(--acc);outline-offset:1px}
.ht{width:100%;font-size:12.5px}.ht th,.ht td{position:static;padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}
.ht th{font-size:11px;background:var(--soft)}
.ug{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}.ug h5{font-family:var(--fc);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);margin-bottom:4px}
.rules{line-height:1.6;font-size:12.5px}.rules ul{margin:4px 0 10px 18px}
#toast{position:fixed;right:18px;bottom:18px;z-index:90;max-width:min(420px,92vw);padding:12px 16px;border-radius:12px;background:#14181d;color:#fff;border-left:4px solid var(--acc2);box-shadow:0 18px 46px rgba(0,0,0,.35)}#toast[hidden]{display:none}
@media(max-width:1350px){.ov{grid-template-columns:300px 1fr}.ov>.wlp{grid-column:1/-1}.strip{grid-template-columns:repeat(3,1fr)}.strip>div:nth-child(3){border-right:0}.strip>div:nth-child(-n+3){border-bottom:1px solid var(--line)}}
@media(max-width:900px){body{grid-template-columns:1fr}.side{position:static;height:auto}.ov{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,1fr)}.uc{width:120px;min-width:120px}.sfoot{margin-top:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.side,.tb,.scrim,.drawer{display:none!important}body{display:block}}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><div class="mk">KD</div><div><b>KIDECO</b><small>Component Health</small></div></div>
  <div><div class="sh">Fleet / Model</div><div class="nav" id="nav"></div></div>
  <div><div class="sh">Health status</div><div class="chips" id="stchips"></div></div>
  <div><div class="sh">Department</div><select id="dept"><option value="ALL">All departments</option></select></div>
  <div style="display:grid;gap:8px">
    <label class="tog">Monitored components only <input type="checkbox" id="cmonly"></label>
    <label class="tog">Dark mode <input type="checkbox" id="dark"></label>
  </div>
  <div class="sfoot">
    <div><span class="dot" id="dot"></span><span id="chip">Waiting for data</span></div>
    <div id="meta" style="line-height:1.45">—</div>
    <button class="sbtn pri" id="sync">⟳ Sync Google Sheets</button>
    <div class="srow"><button class="sbtn" id="file">Load file</button><button class="sbtn" id="rules">Rules</button></div>
    <input id="fileIn" type="file" accept=".csv,.xlsx,.xls" hidden>
  </div>
</aside>

<main>
  <div class="top">
    <div><div class="crumb" id="crumb">Fleet overview</div><h1 id="title">All Fleet</h1></div>
    <div class="tb">
      <input id="q" class="in" placeholder="Search unit, component, remark…" autocomplete="off">
      <select id="sort" class="in"><option value="unit">Sort: Unit A–Z</option><option value="risk">Sort: Highest risk</option><option value="life">Sort: Highest life %</option></select>
      <button class="btn" id="reset">Reset</button>
      <button class="btn acc" id="exp">Export CSV</button>
    </div>
  </div>

  <section class="panel strip" id="strip"></section>

  <section class="ov">
    <div class="panel"><div class="ph"><h2>Health distribution</h2><span class="sub" id="pie-lbl"></span></div>
      <div class="pie"><div class="cv"><svg viewBox="0 0 200 200" id="pie"></svg><div class="ctr"><b id="pct">–</b><span>Normal</span></div></div><div class="lg" id="legend"></div><div class="ndn sub" id="ndn"></div></div></div>
    <div class="panel"><div class="ph"><h2>By component</h2><span class="sub">click to locate</span></div><div class="cbars" id="cbars"></div></div>
    <div class="panel wlp"><div class="ph"><h2>Critical &amp; Extreme worklist</h2><span class="sub" id="wl-n"></span></div><div class="wl" id="wl"></div></div>
  </section>

  <section class="panel mx">

   cstat:(v=>v==="-"||v==="0"?"":v)(get(r,C.cstat)),sos:grade(get(r,C.sos)),mp:grade(get(r,C.mp)),cf:grade(get(r,C.cf)),cts:ctsGrade(get(r,C.cts)),ctsRaw:get(r,C.cts),

   changes:chg.map(i=>({hm:txt(r[i]),date:txt(r[i+1])})).filter(x=>x.hm&&x.hm!=="-")};

 try{const res=await fetch(CSV_URL+(CSV_URL.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);
  const t=await res.text();if(/^\s*<!doctype html/i.test(t))throw Error("Sheet is not published as CSV");
  loadText(t,true);chip("live",`Live · ${UNITS.length} units`);$("meta").textContent=`Synced ${new Date(SRC.at).toLocaleString()} · ${RECS.length} components`}
 catch(e){const c=lsGet(CACHE_KEY);if(c&&!RECS.length){try{loadText(c,false);SRC.at=+lsGet(CACHE_AT)||0}catch{}}
  chip(RECS.length?"cached":"error",RECS.length?"Cached data":"Data unavailable");
  $("meta").textContent=RECS.length?`Google Sheets unavailable (${e.message}). Showing data saved ${SRC.at?new Date(SRC.at).toLocaleString():"earlier"}.`:`Could not load: ${e.message}`;toast("Sync failed: "+e.message)}
 finally{b.disabled=false}}
async function loadFile(f){
 try{chip("busy","Reading file…");let t;
  if(/\.csv$/i.test(f.name))t=await f.text();
  else{if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";s.onload=ok;s.onerror=()=>no(Error("Could not load Excel reader"));document.head.append(s)});
   const wb=XLSX.read(await f.arrayBuffer());const n=wb.SheetNames.find(n=>/comp/i.test(n))||wb.SheetNames[0];t=XLSX.utils.sheet_to_csv(wb.Sheets[n])}
  loadText(t,false);chip("cached",`File · ${UNITS.length} units`);$("meta").textContent=`Loaded “${f.name}”. Press Sync to return to Google Sheets.`}
 catch(e){toast("File error: "+e.message);chip("error","File error")}}

/* ================= VIEW ================= */
const scope=()=>UNITS.filter(u=>(S.model==="ALL"||u.model===S.model)&&(S.dept==="ALL"||u.dept===S.dept));
const recsOf=us=>us.flatMap(u=>Object.values(u.comps));
const counts=rs=>{const s={Normal:0,Caution:0,Critical:0,Extreme:0,"No Data":0};for(const r of rs)s[r.status]++;return s};
const worst=u=>Math.max(-1,...Object.values(u.comps).map(c=>c.lv));
const maxLife=u=>Math.max(0,...Object.values(u.comps).map(c=>Number.isFinite(c.pct)?c.pct:0));
function visible(){const q=S.q.toLowerCase();
 let a=scope().filter(u=>(S.st==="ALL"||Object.values(u.comps).some(c=>c.status===S.st))&&(!q||[u.id,u.model,u.dept,...Object.values(u.comps).flatMap(c=>[c.comp,c.hist,c.cstat,c.rec])].some(v=>txt(v).toLowerCase().includes(q))));
 if(S.sort==="risk")a.sort((x,y)=>worst(y)-worst(x)||recsOf([y]).filter(c=>c.lv>=2).length-recsOf([x]).filter(c=>c.lv>=2).length||natural(x.id,y.id));
 if(S.sort==="life")a.sort((x,y)=>maxLife(y)-maxLife(x)||natural(x.id,y.id));return a}
const cols=us=>{const s=new Set();for(const u of us)for(const c of Object.values(u.comps))if(!S.cmonly||c.status!=="No Data")s.add(c.comp);return COMPS.filter(c=>s.has(c))};
const stackHtml=(s,tot)=>["Normal","Caution","Critical","Extreme"].map(k=>s[k]?`<i style="width:${s[k]/tot*100}%;background:${COL[k]}" title="${k}: ${s[k]}"></i>`:"").join("");

function tile(r){
 if(!r)return`<div class="ph0">—</div>`;
 const over=r.pct>=1,res=[["SOS",r.sos],["MP",r.mp],["CF",r.cf]].filter(x=>x[1]);
 return`<button class="tile${S.st!=="ALL"&&r.status!==S.st?" dim":""}" data-s="${r.status}" data-cell="${esc(r.unit)}|${esc(r.comp)}">
  <div class="th"><b>${r.status==="No Data"?"No CM data":r.status}</b>${r.status!=="No Data"?`<span class="gr">${LET[r.status]}</span>`:""}</div>
  <div class="tb2">
   <div class="lf"><span class="mono" style="font-size:10.5px">${fh(r.life)} / ${fh(r.target)} h</span><span class="pc${over?" ovr":""}">${pctTxt(r.pct)}</span>
    <span class="bar"><i style="width:${Math.min(100,Math.max(0,(r.pct||0)*100))}%;background:${lifeCol(r.pct)}"></i><u></u></span>
    <small class="${over?"ovr":""}">Remaining ${fh(r.remH)} h${Number.isFinite(r.remM)?" · "+f1(r.remM)+" mo":""}</small></div>
   ${res.length||r.cts?`<div class="rs">${res.map(([k,o])=>`<div class="rr"><span>${k}</span>${gr(o.latest)}<span class="tr">trend ${[...o.trend].map(l=>gr(l,"s")).join("")}</span></div>`).join("")}${r.cts?`<div class="rr"><span>CTS</span>${gr(r.cts)}<span class="tr">${["Normal","Order parts","Schedule replacement","Replace now"][GRADE[r.cts]]}</span></div>`:""}</div>`:""}
   ${r.lv>=1?`<div class="rec">${r.lv>=2?"🔧 ":""}${esc(r.rec)}</div>`:""}
   ${r.cstat||r.hist?`<div class="tags">${r.cstat?`<span class="tag w">${esc(r.cstat)}</span>`:""}${r.hist?`<span class="tag" title="${esc(r.hist)}">${esc(r.hist)}</span>`:""}</div>`:""}
  </div></button>`}

function render(){
 const us=scope(),rs=recsOf(us),s=counts(rs),mon=rs.length-s["No Data"],vis=visible(),over=rs.filter(r=>r.pct>=1);
 const affected=k=>new Set(rs.filter(r=>r.status===k).map(r=>r.unit)).size;
 $("title").textContent=S.model==="ALL"?"All Fleet":S.model;$("crumb").textContent=`Fleet overview${S.dept!=="ALL"?" · "+S.dept:""}${S.st!=="ALL"?" · "+S.st:""}`;
 // sidebar nav
 const models=uniq(UNITS.map(u=>u.model)).sort();
 $("nav").innerHTML=[["ALL","All Fleet",UNITS],...models.map(m=>[m,m,UNITS.filter(u=>u.model===m)])].map(([k,l,ul])=>{const c=counts(recsOf(ul)),t=STATUS.reduce((a,x)=>a+c[x],0)||1;
  return`<button class="${S.model===k?"on":""}" data-m="${esc(k)}"><b>${esc(l)}</b><span>${ul.length} units</span><span class="mini">${stackHtml(c,t)}</span><span style="grid-column:1/-1">${c.Extreme} X · ${c.Critical} C · ${c.Caution} B</span></button>`}).join("");
 $("stchips").innerHTML=[["ALL","All"],...ALLST.map(k=>[k,k])].map(([k,l])=>`<button class="${S.st===k?"on":""}" data-st="${esc(k)}">${k!=="ALL"?gr(LET[k],"s"):""}${l}</button>`).join("");
 // strip
 const tot=mon||1;
 $("strip").innerHTML=`<div style="--c:var(--acc)"><small>Units</small><b>${us.length}</b><span>${rs.length} components · ${mon} monitored</span></div>
  ${[["Extreme","#7f1d1d"],["Critical","#ef4444"],["Caution","#eab308"],["Normal","#16a34a"]].map(([k,c])=>`<div style="--c:${c}"><small>${k} (${LET[k]})</small><b style="color:${k==="Caution"?"#ca8a04":k==="Extreme"?"var(--xt)":c}">${s[k]}</b><span>${k==="Normal"?Math.round(s.Normal/tot*100)+"% of monitored":affected(k)+" unit"+(affected(k)===1?"":"s")+" affected"}</span></div>`).join("")}
  <div style="--c:#7c3aed"><small>Over target life</small><b style="color:#7c3aed">${over.length}</b><span>${new Set(over.map(r=>r.unit)).size} units · life ≥ 100%</span></div>
  <div class="stack">${stackHtml(s,tot)}</div>`;
 // donut
 $("pie-lbl").textContent=`${mon} monitored`;$("pct").textContent=mon?Math.round(s.Normal/mon*100)+"%":"–";
 const R=78,L=2*Math.PI*R;let off=0;
 $("pie").innerHTML=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--soft)" stroke-width="30"/>`+(mon?STATUS.map(k=>{const v=s[k]/mon*L,gap=s[k]&&s[k]<mon?1.5:0;const h=v?`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${COL[k]}" stroke-width="30" stroke-dasharray="${Math.max(0,v-gap)} ${L-v+gap}" stroke-dashoffset="${-off}" data-st="${k}"><title>${k}: ${s[k]}</title></circle>`:"";off+=v;return h}).join(""):"");
 $("legend").innerHTML=["Extreme","Critical","Caution","Normal"].map(k=>`<button class="${S.st===k?"on":""}" data-st="${k}">${gr(LET[k])}<span>${k}<small>${mon?(s[k]/mon*100).toFixed(1):0}%</small></span><b>${s[k]}</b></button>`).join("");
 $("ndn").innerHTML=s["No Data"]?`${s["No Data"]} components without SOS/MP/CF/CTS result are not counted.`:"";
 // component bars
 const cm=new Map();for(const r of rs){if(r.status==="No Data")continue;const e=cm.get(r.comp)||cm.set(r.comp,counts([])).get(r.comp);e[r.status]++}
 const cl=[...cm].sort((a,b)=>(b[1].Extreme*1e6+b[1].Critical*1e3+b[1].Caution)-(a[1].Extreme*1e6+a[1].Critical*1e3+a[1].Caution));
 $("cbars").innerHTML=cl.length?cl.map(([n,c])=>{const t=STATUS.reduce((a,k)=>a+c[k],0);return`<button class="cb" data-comp="${esc(n)}" title="${STATUS.map(k=>k+": "+c[k]).join(" · ")}"><span>${esc(n)}</span><span class="bt">${stackHtml(c,t)}</span><em>${t}</em></button>`}).join(""):'<div class="empty">No monitored components.</div>';
 // worklist
 const wl=rs.filter(r=>r.lv>=2).sort((a,b)=>b.lv-a.lv||(b.pct||0)-(a.pct||0)||natural(a.unit,b.unit));
 $("wl-n").textContent=wl.length?`${wl.length} items`:"";
 $("wl").innerHTML=wl.length?wl.map(r=>`<button class="wi" data-cell="${esc(r.unit)}|${esc(r.comp)}">${gr(LET[r.status])}<b>${esc(r.comp)}</b><span class="u">${esc(r.unit)} · ${pctTxt(r.pct)}</span><p>${esc(r.rec)}</p></button>`).join(""):'<div class="empty">No Critical or Extreme components 🎉</div>';
 // table
 const cs=cols(vis.length?vis:us);
 $("head").innerHTML=`<tr><th class="uc">Unit</th>${cs.map(c=>`<th data-c="${esc(c)}">${esc(c)}</th>`).join("")}</tr>`;
 $("body").innerHTML=vis.length?vis.map(u=>`<tr><td class="uc"><button class="un" data-unit="${esc(u.id)}">${esc(u.id)}</button><div class="um">${esc(u.model)} · ${esc(u.dept)}<br><span class="mono">HM ${fh(u.hm)} h</span></div><div class="hs">${COMPS.filter(k=>u.comps[k]&&u.comps[k].status!=="No Data").map(k=>`<i style="background:${COL[u.comps[k].status]}" title="${esc(k)}: ${u.comps[k].status}"></i>`).join("")}</div></td>${cs.map(k=>`<td class="cc">${tile(u.comps[k])}</td>`).join("")}</tr>`).join("")
  :`<tr><td colspan="${cs.length+1}" class="empty">No matching units.</td></tr>`;
 $("count").textContent=`${vis.length} of ${us.length} units shown · ${cs.length} component columns`}
function focusComp(n){const th=[...document.querySelectorAll("th[data-c]")].find(t=>t.dataset.c===n);if(th){th.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});th.classList.add("hl");setTimeout(()=>th.classList.remove("hl"),2400)}}

/* ================= DRAWER ================= */
function openDrawer(head,body,wide,exp){$("d-head").innerHTML=head;$("d-body").innerHTML=body;$("d-body").scrollTop=0;$("drawer").classList.toggle("wide",!!wide);$("d-exp").hidden=!exp;
 $("drawer").classList.add("on");$("scrim").classList.add("on");$("drawer").setAttribute("aria-hidden","false")}
function closeDrawer(){$("drawer").classList.remove("on");$("scrim").classList.remove("on");$("drawer").setAttribute("aria-hidden","true")}
const seqRow=(o,l)=>`<tr><td><b>${l}</b></td><td>${o?gr(o.latest)+" "+STATUS[GRADE[o.latest]]:'<span class="sub">No result</span>'}</td><td>${o?`<div class="seq">${[...o.seq].map((c,i)=>gr(c,i<3?"s t":"s")).join("")}</div>`:""}</td></tr>`;
function aiHtml(r){
 const a=r.ai,key=`kdc2_chk_${r.unit}|${r.comp}`;let done={};try{done=JSON.parse(lsGet(key)||"{}")}catch{}
 const item=(t,i,ex)=>`<label class="${ex?"ex":""}"><input type="checkbox" data-chk="${esc(key)}" data-i="${i}"${done[i]?" checked":""}><span>${esc(t)}</span></label>`;
 return`<div class="ai"><div class="aih"><b>🔧 ${esc(a.headline)}</b><span class="badge">AI analyst</span></div><div class="aib">
  <div class="timing" style="--c:${COL[r.status]}">⏱ ${esc(a.timing)}</div>
  <div><h4>Likely concern</h4><p style="line-height:1.5">${esc(a.concern)}</p></div>
  ${a.extreme.length?`<div><h4>Immediate actions (Extreme)</h4><div class="chk">${a.extreme.map((t,i)=>item(t,"x"+i,1)).join("")}</div></div>`:""}
  <div><h4>Inspection checklist</h4><div class="chk">${a.checks.map((t,i)=>item(t,i)).join("")}</div></div>
  ${a.els.length?`<div><h4>Wear element interpretation (from remark)</h4><ul>${a.els.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
  ${a.notes.length?`<div><h4>Analyst notes</h4><ul>${a.notes.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
 </div><div class="disc">AI-generated guidance based on general Caterpillar condition-monitoring and reliability practice. Always confirm with the S·O·S lab comments, Cat SIS service procedures/specifications and your Cat dealer before major decisions. Checklist ticks are saved on this device only.</div></div>`}
function openComp(unit,comp){
 const u=UNITS.find(x=>x.id===unit),r=u?.comps[comp];if(!r)return;
 const t=r.status==="Caution"?"#3b2a00":"#fff",c=r.status==="No Data"?"#64748b":COL[r.status];
 const body=`<div class="hero" style="--c:${c};--t:${t}"><span class="gr">${LET[r.status]==="_"?"–":LET[r.status]}</span><div><b>${r.status==="No Data"?"No condition data":r.status}</b><p>${esc(r.rec||"No SOS / magnetic plug / cutting filter / CTS result recorded for this component.")}</p></div></div>
  <div class="kv"><div><small>Model</small><b>${esc(r.model)}</b></div><div><small>Department</small><b>${esc(r.dept)}</b></div><div><small>Current HM</small><b class="mono">${fh(r.hm)}</b></div><div><small>Comp. life</small><b class="mono">${fh(r.life)} h</b></div><div><small>Target life</small><b class="mono">${fh(r.target)} h</b></div><div><small>Life used</small><b class="mono" style="color:${lifeCol(r.pct)}">${pctTxt(r.pct)}</b></div><div><small>Remaining</small><b class="mono">${fh(r.remH)} h · ${f1(r.remM)} mo</b></div><div><small>Avg schedule</small><b class="mono">${f1(r.avg)} h/day</b></div>${r.cstat?`<div><small>Comp. status</small><b>${esc(r.cstat)}</b></div>`:""}${r.top?`<div><small>Top-up oil</small><b>${esc(r.top)} L</b></div>`:""}</div>
  ${r.ai?`<div class="sec"><h3>Recommendation</h3>${aiHtml(r)}</div>`:r.lv>=0?`<div class="sec"><h3>Recommendation</h3><p>${esc(r.rec)}</p></div>`:""}
  <div class="sec"><h3>Condition results <span class="sub" style="font-family:var(--f);letter-spacing:0;text-transform:none;font-size:11.5px">latest on the left · outlined = trend</span></h3><table class="ht"><tbody>${seqRow(r.sos,"S·O·S")}${seqRow(r.mp,"Magnetic plug")}${seqRow(r.cf,"Cutting filter")}<tr><td><b>CTS</b></td><td colspan="2">${r.cts?gr(r.cts)+" "+["Normal","Caution – please order the parts","Critical – please schedule the replacement","Extreme – replace the parts immediately"][GRADE[r.cts]]:`<span class="sub">${esc(r.ctsRaw||"No result")}</span>`}</td></tr></tbody></table></div>
  ${r.hist?`<div class="sec"><h3>Maintenance remark</h3><p>${esc(r.hist)}</p></div>`:""}
  <div class="sec"><h3>Component change history</h3>${r.changes.length?`<table class="ht"><thead><tr><th>#</th><th>Installed at HM</th><th>Date</th></tr></thead><tbody>${r.changes.map((c,i)=>`<tr><td>${i+1}</td><td class="mono">${fh(num(c.hm))}</td><td>${esc(c.date||"-")}</td></tr>`).join("")}</tbody></table>`:'<p class="sub">No change history.</p>'}</div>`;
 openDrawer(`<div class="k">${esc(r.unit)} · ${esc(r.model)}</div><h2>${esc(r.comp)}</h2>`,body)}
function openUnit(id){
 const u=UNITS.find(x=>x.id===id);if(!u)return;CUR=u;const c=counts(Object.values(u.comps));
 const body=`<div class="kv">${ALLST.map(k=>`<div><small>${k}</small><b style="color:${k==="Caution"?"#ca8a04":COL[k]}">${c[k]}</b></div>`).join("")}</div>
  <div class="ug">${COMPS.filter(k=>u.comps[k]).sort((a,b)=>u.comps[b].lv-u.comps[a].lv).map(k=>`<div><h5>${esc(k)}</h5>${tile(u.comps[k])}</div>`).join("")}</div>`;
 openDrawer(`<div class="k">${esc(u.model)} · ${esc(u.dept)} · HM ${fh(u.hm)} h</div><h2>${esc(u.id)}</h2>`,body,true,true)}
function openRules(){openDrawer(`<div class="k">How status is calculated</div><h2>Health rules</h2>`,`<div class="rules">
 <p><b>Reading results:</b> from the <b>left</b>. Example <span class="mono">XBBACC</span> → latest <b>X</b>, trend <b>X B B</b>. “_” = no sample.</p><br>
 <p><b>S·O·S, Magnetic Plug, Cutting Filter (latest result)</b></p><ul><li>${gr("X","s")} Extreme – dark red</li><li>${gr("C","s")} Critical – red</li><li>${gr("B","s")} Caution – yellow</li><li>${gr("A","s")} Normal – green</li></ul>
 <p><b>Combined rule:</b> latest SOS = B <b>and</b> Magnetic Plug = B <b>and</b> Cutting Filter = B → <b>Critical</b>.</p><br>
 <p><b>CTS:</b> A Normal · B Caution (please order the parts) · C Critical (please schedule the replacement) · X Extreme (replace the parts immediately).</p><br>
 <p><b>Component status</b> = worst of all results above. Components without any result = <b>No CM data</b> and are excluded from the pie chart. Life % is informational and does not change health status.</p><br>
 <p><b>Recommendations</b> for Critical and Extreme are generated by built-in AI analyst rules per component group (engine, transmission/torque converter, final drive, hydraulic, track link, undercarriage), including trend analysis, life-based notes and wear-element interpretation from the remark column.</p></div>`)}

/* ================= EXPORT ================= */
function exportCSV(rs,name){
 if(!rs.length)return toast("Nothing to export.");
 const cell=v=>{let s=txt(v);if(/^[=+\-@]/.test(s)&&!/^-?\d/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};
 const head=["Unit No.","Model","Dept","Component","Health","Current HM","Comp life (h)","Target (h)","Life %","Remaining (h)","SOS latest","SOS trend","MP latest","MP trend","CF latest","CF trend","CTS","Recommendation","Timing","Inspection checklist","Component status","Remark"];
 const rows=rs.map(r=>[r.unit,r.model,r.dept,r.comp,r.status,fh(r.hm),fh(r.life),fh(r.target),pctTxt(r.pct),fh(r.remH),r.sos?.latest||"",r.sos?.trend||"",r.mp?.latest||"",r.mp?.trend||"",r.cf?.latest||"",r.cf?.trend||"",r.cts||"",r.rec,r.ai?.timing||"",r.ai?[...r.ai.extreme,...r.ai.checks].map((t,i)=>(i+1)+". "+t).join(" "):"",r.cstat,r.hist]);
 const blob=new Blob(["﻿"+[head,...rows].map(r=>r.map(cell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});
 const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}

/* ================= INIT ================= */
function init(){
 const th=lsGet("kdc2_theme")||"light";document.documentElement.dataset.theme=th;$("dark").checked=th==="dark";
 $("dark").onchange=e=>{const t=e.target.checked?"dark":"light";document.documentElement.dataset.theme=t;lsSet("kdc2_theme",t)};
 let tm;$("q").oninput=e=>{S.q=e.target.value.trim();clearTimeout(tm);tm=setTimeout(render,150)};
 $("sort").onchange=e=>{S.sort=e.target.value;render()};$("dept").onchange=e=>{S.dept=e.target.value;render()};$("cmonly").onchange=e=>{S.cmonly=e.target.checked;render()};
 $("reset").onclick=()=>{Object.assign(S,{model:"ALL",st:"ALL",q:"",dept:"ALL",sort:"unit",cmonly:false});$("q").value="";$("sort").value="unit";$("dept").value="ALL";$("cmonly").checked=false;render()};
 $("sync").onclick=sync;$("file").onclick=()=>$("fileIn").click();$("fileIn").onchange=e=>{const f=e.target.files[0];if(f)loadFile(f);e.target.value=""};
 $("rules").onclick=openRules;$("d-close").onclick=closeDrawer;$("scrim").onclick=closeDrawer;
 $("exp").onclick=()=>{const cs=new Set(cols(visible()));exportCSV(recsOf(visible()).filter(r=>cs.has(r.comp)&&(S.st==="ALL"||r.status===S.st)),`Kideco_Component_Health_${new Date().toISOString().slice(0,10)}.csv`)};
 $("d-exp").onclick=()=>CUR&&exportCSV(Object.values(CUR.comps),`Kideco_${CUR.id}.csv`);
 document.addEventListener("change",e=>{const c=e.target.closest("[data-chk]");if(!c)return;let d={};try{d=JSON.parse(lsGet(c.dataset.chk)||"{}")}catch{}d[c.dataset.i]=c.checked;lsSet(c.dataset.chk,JSON.stringify(d))});
 document.addEventListener("click",e=>{const t=e.target.closest("[data-m],[data-st],[data-comp],[data-unit],[data-cell]");if(!t)return;
  if(t.dataset.m!==undefined){S.model=t.dataset.m;render()}
  else if(t.dataset.st){S.st=S.st===t.dataset.st&&t.dataset.st!=="ALL"?"ALL":t.dataset.st;render()}
  else if(t.dataset.comp)focusComp(t.dataset.comp);
  else if(t.dataset.unit)openUnit(t.dataset.unit);
  else if(t.dataset.cell){const i=t.dataset.cell.indexOf("|");openComp(t.dataset.cell.slice(0,i),t.dataset.cell.slice(i+1))}});
 document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
 const c=lsGet(CACHE_KEY);if(c){try{build(parseCSV(c));SRC={at:+lsGet(CACHE_AT)||0};render();chip("cached","Cached data")}catch{}}
 sync();if(AUTO_REFRESH_MIN>0)setInterval(()=>{if(!document.hidden)sync()},AUTO_REFRESH_MIN*6e4)}
document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init):init();
</script>
